[project]
name = "autonomous-trading-lab"
version = "0.1.0"
description = "Research, backtesting, and paper trading for perpetual futures"
requires-python = ">=3.11"
license = {text = "MIT"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
